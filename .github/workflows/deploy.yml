name: Deploy Pipeline

on:
  push:
    branches: [main]

concurrency:
  group: deploy-pipeline
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # ============================================================================
  # JOB 1: Test & Build
  # ============================================================================
  build:
    name: Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run unit tests
        run: pnpm test

      - name: Build applications
        run: pnpm build

      - name: Upload API dist bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: api-dist
          path: apps/api/dist/
          retention-days: 7

      - name: Upload Web dist bundle artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  # ============================================================================
  # JOB 2: Deploy Production
  # ============================================================================
  deploy:
    name: Deploy Production
    needs: [build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.9

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Download API dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: api-dist
          path: apps/api/dist

      - name: Download Web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: web-dist
          path: apps/web/dist

      - name: Configure AWS Credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: 1.10.5
          terraform_wrapper: false

      - name: Terraform Init & Apply
        run: |
          cd infra/envs/prod
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=pulse/prod/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'us-east-1' }}"
          
          terraform plan \
            -var="github_repo=${{ github.repository }}" \
            -var="state_bucket_arn=arn:aws:s3:::${{ vars.TF_STATE_BUCKET }}" \
            -out=tfplan-prod

          terraform apply -auto-approve tfplan-prod
          
          API_URL=$(terraform output -raw api_url)
          echo "PROD_API_URL=$API_URL" >> $GITHUB_ENV
          echo "API URL is: $API_URL"

      - name: Deploy Cloudflare Worker
        uses: cloudflare/wrangler-action@9acf94ace14e7dc412b076f2c5c20b8ce93c79cd # v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: 'apps/worker'
          command: deploy --var API_ORIGIN:${{ env.PROD_API_URL }}

      - name: Smoke Test Health Endpoint
        run: |
          echo "Running smoke test on AWS API Gateway health..."
          HEALTH_URL="${{ env.PROD_API_URL }}api/health"
          echo "Target: $HEALTH_URL"
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$HEALTH_URL")
          if [ "$STATUS" -ne 200 ]; then
            echo "Smoke test FAILED with HTTP $STATUS"
            curl -i "$HEALTH_URL"
            exit 1
          fi
          echo "Smoke test PASSED with HTTP 200: $(curl -s $HEALTH_URL)"
